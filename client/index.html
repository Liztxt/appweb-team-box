<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO básico -->
    <title>Team Box — Gestión de documentos corporativos</title>
    <meta name="description" content="Plataforma corporativa para gestión de documentos y plantillas por equipos de trabajo." />
    <meta name="author" content="Team Box" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph -->
    <meta property="og:title" content="Team Box" />
    <meta property="og:description" content="Plataforma corporativa para gestión de documentos y plantillas por equipos de trabajo." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://team-box-client.onrender.com" />
    <meta property="og:image" content="https://team-box-client.onrender.com/icons.svg" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Team Box" />
    <meta name="twitter:description" content="Plataforma corporativa para gestión de documentos y plantillas." />

    <!-- Microinteracciones -->
    <style>
      button {
        transition: opacity 0.15s ease, transform 0.15s ease, background 0.15s ease;
      }
      button:hover:not(:disabled) {
        opacity: 0.88;
        transform: translateY(-1px);
      }
      button:active:not(:disabled) {
        transform: translateY(0px);
        opacity: 1;
      }
      input, select {
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input:focus, select:focus {
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        border-color: #6366F1 !important;
      }
      * {
        transition: background-color 0.1s ease;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
